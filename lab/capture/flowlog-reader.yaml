# Short-lived pod that reads flow log blobs over the private endpoint. Created and deleted by sources/flowlogs.sh.
apiVersion: v1
kind: Pod
metadata:
  name: flowlog-reader
  namespace: sattle-demo
  labels: { project: sattle, app: flowlog-reader }
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: curl
      image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
      command: [sleep, "900"]
      securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
      resources: { requests: { cpu: 5m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
      volumeMounts: [{ name: tmp, mountPath: /tmp }]
  volumes: [{ name: tmp, emptyDir: {} }]
