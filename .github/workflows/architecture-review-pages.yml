name: Deploy architecture review

on:
  push:
    branches: [main]
    paths:
      - "architecture-review/**"
      - "engine/src/**"
      - "engine/definitions/**"
      - "canvas/src/**"
      - "canvas/PERF.md"
      - "engine/PERF.md"
      - "paper/**"
      - "CLAUDE.md"
      - "README.md"
      - ".github/workflows/architecture-review-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: architecture-review/package-lock.json
      - name: Check and build
        working-directory: architecture-review
        run: |
          npm ci
          npm run check
      - name: Deploy when Cloudflare credentials are configured
        working-directory: architecture-review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Build verified. Public deployment skipped until Cloudflare secrets are configured."
            echo "Public deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler pages deploy dist --project-name=sattle-architecture-review
